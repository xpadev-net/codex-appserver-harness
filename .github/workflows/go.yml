name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Full storage fixtures include canonical depth-three creation/recovery.
      # This suite budget is separate from production source freshness gates.
      - run: go test -timeout 20m ./...
      - run: go vet ./...
